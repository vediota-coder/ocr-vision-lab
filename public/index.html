<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OCR Vision Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>OCR Vision Lab</h1>
        <p class="subtitle">
          Загрузи папку с изображениями — получишь проверенный PDF.
          Claude + GPT распознают независимо, Claude сверяет результаты.
        </p>
      </header>

      <section class="card">
        <form id="upload-form">
          <label class="dropzone" id="dropzone">
            <input
              type="file"
              id="folder-input"
              webkitdirectory
              directory
              multiple
              accept="image/*"
              hidden
            />
            <input
              type="file"
              id="files-input"
              multiple
              accept="image/*"
              hidden
            />
            <div class="dz-content">
              <strong id="dz-title">Выбери папку или файлы</strong>
              <span id="dz-hint">PNG / JPG / WEBP / GIF</span>
              <div class="dz-buttons">
                <button type="button" id="pick-folder">Папка</button>
                <button type="button" id="pick-files">Файлы</button>
              </div>
            </div>
          </label>

          <div id="file-list" class="file-list"></div>

          <button type="submit" id="submit-btn" disabled>
            Распознать и собрать PDF
          </button>
        </form>
      </section>

      <section class="card" id="progress-card" hidden>
        <h2>Прогресс</h2>
        <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
        <p id="status">Ожидание…</p>
        <ul id="log" class="log"></ul>
        <a id="download" class="download" hidden>Скачать PDF</a>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
